name: Build SPFx (react-news-banner)

on:
  workflow_dispatch:
  push:
    paths:
      - "samples/react-news-banner/**"
      - ".github/workflows/build-react-news-banner.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: samples/react-news-banner
    env:
      NODE_VERSION: "14.18.1"
      NODE_OPTIONS: "--max_old_space_size=4096"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "samples/react-news-banner/package-lock.json"

      - name: Install Python 2.7 and build tools (node-gyp v3/deasync)
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 build-essential
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
          npm config set python /usr/bin/python2
          npm config set unsafe-perm true

      - name: Show versions
        run: |
          node -v
          npm -v
          python -V || true

      # 👇 NEW: satisfy old glob expecting typings/main.d.ts
      - name: Create legacy typings stub (fix glob)
        run: |
          mkdir -p typings
          touch typings/main.d.ts

      # Keep the Gulp 4 toolchain to avoid "primordials" crash
      - name: Preinstall Gulp 4 toolchain
        run: |
          npm install --save-dev gulp@^4.0.2 vinyl-fs@^3.0.3 undertaker@^1.3.0 gulp-cli@^2.3.0

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify gulp version
        run: |
          npx gulp --version
          npm ls gulp | cat

      - name: Build / Bundle (ship)
        run: |
          npx gulp clean
          npx gulp bundle --ship

      - name: Package solution (ship)
        run: npx gulp package-solution --ship

      - name: Upload .sppkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: sppkg-react-news-banner
          path: samples/react-news-banner/sharepoint/solution/*.sppkg
          if-no-files-found: error
