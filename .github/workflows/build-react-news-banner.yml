name: Build SPFx (react-news-banner)

on:
  workflow_dispatch:
  push:
    paths:
      - "samples/react-news-banner/**"
      - ".github/workflows/build-react-news-banner.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: samples/react-news-banner
    env:
      NODE_VERSION: "14.18.1"                  # SPFx 1.12.x compatible
      NODE_OPTIONS: "--max_old_space_size=4096"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: samples/react-news-banner/package-lock.json

      # node-gyp v3 deps (e.g., deasync) expect Python 2.x
      - name: Install Python 2.7 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 build-essential
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
          npm config set python /usr/bin/python2
          npm config set unsafe-perm true

      - name: Show versions
        run: |
          node -v
          npm -v
          python -V || true

      # Create common legacy typings stubs
      - name: Create legacy typings stubs (common)
        run: |
          mkdir -p typings
          : > typings/main.d.ts
          : > typings/tsd.d.ts
          : > typings/index.d.ts

      # Auto-detect any additional typings/*.d.ts referenced and stub them too
      - name: Autodetect + stub any other legacy typings
        run: |
          mkdir -p typings
          # search typical places where these globs may appear
          files=$(grep -Rho "typings/[A-Za-z0-9_./-]*\.d\.ts" gulpfile.js src config || true | sort -u)
          for f in $files; do
            echo "Stubbing $f"
            mkdir -p "$(dirname "$f")"
            : > "$f"
          done

      # Avoid "primordials is not defined" by pinning gulp 4 toolchain
      - name: Preinstall Gulp 4 toolchain
        run: |
          npm install --save-dev gulp@^4.0.2 vinyl-fs@^3.0.3 undertaker@^1.3.0 gulp-cli@^2.3.0

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # node-sass sometimes needs a rebuild on runners
      - name: Rebuild node-sass (best effort)
        run: npm rebuild node-sass || true

      - name: Verify gulp version
        run: |
          npx gulp --version
          npm ls gulp | cat

      - name: Build / Bundle (ship)
        run: |
          npx gulp clean
          npx gulp bundle --ship

      - name: Package solution (ship)
        run: npx gulp package-solution --ship

      # Diagnostics + make it easy to find the .sppkg
      - name: Show where outputs landed
        run: |
          echo "Looking for .sppkg under $(pwd)"
          find . -maxdepth 6 -type f -name "*.sppkg" -print || true
          echo "--- sharepoint/solution ---"
          ls -la sharepoint/solution || true
          echo "--- temp/deploy ---"
          ls -la temp/deploy || true

      - name: Upload .sppkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: sppkg-react-news-banner
          path: |
            sharepoint/solution/*.sppkg
            **/*.sppkg
          if-no-files-found: error
