name: Build SPFx (react-directory)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify sample folder exists
        run: |
          ls -la
          ls -la samples/react-directory

      - name: Use Node 18.x (SPFx 1.18+)
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'

      - name: Install
        working-directory: samples/react-directory
        run: |
          npm config set legacy-peer-deps true
          npm install --no-audit --no-fund

      # IMPORTANT: CI=false prevents 'warnings as errors' behavior that halts gulp before emitting artifacts
      - name: Clean & Bundle (SHIP)
        working-directory: samples/react-directory
        env:
          CI: "false"
        run: |
          npx gulp clean
          npx gulp bundle --ship --verbose
          echo "---- Release folder after bundle ----"
          ls -la release || true
          ls -la release/manifests || true

      # Guard: ensure manifests exist; if not, fail with a clear message
      - name: Ensure manifests exist
        working-directory: samples/react-directory
        run: |
          test -d release/manifests && test "$(ls -1 release/manifests | wc -l)" -gt 0 || (echo "Bundle didn't emit release/manifests/*.json. Check the 'Clean & Bundle' step logs for TypeScript errors above." && exit 1)

      - name: Package
        working-directory: samples/react-directory
        run: npx gulp package-solution --ship

      - name: Show output folder
        run: ls -la samples/react-directory/sharepoint/solution

      - name: Upload .sppkg
        uses: actions/upload-artifact@v4
        with:
          name: sharepoint-solution
          path: samples/react-directory/sharepoint/solution/*.sppkg
