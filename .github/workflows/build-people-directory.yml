name: Build SPFx (react-directory)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node 18.x (SPFx 1.18+)
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'

      - name: Install
        working-directory: samples/react-directory
        run: |
          npm config set legacy-peer-deps true
          npm install --no-audit --no-fund

      # 1) Clean old artifacts
      - name: Clean
        working-directory: samples/react-directory
        run: npx gulp clean || true

      # 2) Bundle (allow warnings; don't stop the job)
      - name: Bundle (allow warnings)
        working-directory: samples/react-directory
        run: |
          npx gulp bundle --ship || echo "::warning ::Bundle returned non-zero exit (ESLint warnings). Continuing."

      # 3) Sanity check: do we have manifests?
      - name: Check manifests
        working-directory: samples/react-directory
        run: |
          echo "Listing release/"
          ls -la release || true
          echo "Listing release/manifests/"
          ls -la release/manifests || true
          test -d release/manifests || (echo "::error ::No manifests folder after bundle" && exit 1)

      # 4) Package
      - name: Package
        working-directory: samples/react-directory
        run: npx gulp package-solution --ship

      - name: Show output folder
        run: ls -la samples/react-directory/sharepoint/solution

      - name: Upload .sppkg
        uses: actions/upload-artifact@v4
        with:
          name: sharepoint-solution
          path: samples/react-directory/sharepoint/solution/*.sppkg
