name: Build SPFx package (react-script-editor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/react-script-editor

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 18 (SPFx-compatible)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            samples/react-script-editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      # === Auto-fix the two unused "e" warnings in ScriptEditorWebPart.ts ===
      - name: Fix lint warnings (rename unused e → _e)
        run: |
          # change "catch (e)" to "catch (_e)"
          sed -i 's/\bcatch (e)/catch (_e)/g' src/webparts/scriptEditor/ScriptEditorWebPart.ts
          # change arrow params "(e)" to "(_e)" when used as a callback
          sed -i 's/(\s*e\s*)\s*=>/(_e)=>/g' src/webparts/scriptEditor/ScriptEditorWebPart.ts

      - name: Build & package (ship)
        run: |
          npx gulp bundle --ship
          npx gulp package-solution --ship
        env:
          # keep CI strict but OK since we removed the warnings
          CI: "true"

      - name: Upload sppkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: spfx-sppkg
          path: samples/react-script-editor/sharepoint/solution/*.sppkg
